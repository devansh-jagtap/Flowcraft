# Runs the production image locally against your Neon database (DATABASE_URL in .env.local).
services:
  app:
    build:
      context: .
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      PORT: 5000
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLIENT_ORIGIN: http://localhost:5000
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_FREE_LIMIT: ${AI_FREE_LIMIT:-5}
      AI_FREE_GUEST_LIMIT: ${AI_FREE_GUEST_LIMIT:-2}
      AI_KEYS_SECRET: ${AI_KEYS_SECRET:-}
      # Nothing sits in front of the container locally, so trust no proxy headers.
      TRUST_PROXY: "false"
    ports:
      - "5000:5000"
