services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    profiles: ["full"]
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/flowcraft
      JWT_SECRET: ${JWT_SECRET:-please-change-me}
      CLIENT_ORIGIN: http://localhost:5000
    ports:
      - "5000:5000"

volumes:
  mongo-data:
